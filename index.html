<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Background Music -->
    <audio id="bg-music" loop muted>
        <source src="photograph.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <div class="container">
        <div class="gif_container">
            <img src="https://gifdb.com/images/high/cute-love-bear-roses-ou7zho5oosxnpo6k.gif" alt="Cute GIF">
        </div>
        <h1>Obi m, Will you be my Valentine?</h1>
        <div class="buttons">
            <button class="yes-button" onclick="handleYesClick()">Yes</button>
            <button class="no-button" onclick="handleNoClick()">No</button>
        </div>
        
        <!-- Music Button -->
        <button class="music-btn" onclick="toggleMusic()">🔇 Unmute Music</button>
    </div>

    <!-- Fixed: Script loaded at end of body -->
    <script src="script.js"></script>
</body>
</html>
